name: kpss-ilan-kontrol

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kpss
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: İlanları kontrol et
        run: python check_ilanlar.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: seen.json güncelle
        if: always()
        run: |
          git config user.name "kpss-bot"
          git config user.email "kpss-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "seen güncelle" && git push)
